name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  kex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kex and Tey from a pinned release, installed with its own
      # install.sh. Bump KEX_VERSION when Marqraft moves to a newer Kex;
      # kexhq/docs' Publish workflow pins the same version.
      # Marqraft calls OTP 27+ functions (json:encode/1, and
      # binary:encode_hex/2 from OTP 26); ubuntu-latest's erlang-base is
      # OTP 25, where every test that scaffolds a site failed with :undef.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"

      - name: Install Kex and Tey
        env:
          KEX_VERSION: 0.4.0-rc.4
        run: |
          curl -fsSL "https://raw.githubusercontent.com/kexhq/kex/v$KEX_VERSION/install.sh" | sh -s -- --kex "$KEX_VERSION"
          echo "$HOME/.local/share/tey/dist/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/tey/bin" >> "$GITHUB_PATH"

      - run: tey install
      - run: tey build
      - run: tey test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
